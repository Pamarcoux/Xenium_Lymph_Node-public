[project]
name = "xenium-analysis"
version = "0.1.0"
description = "Xenium lymph node processing: sopa-segmented SpatialData to clustered AnnData"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anndata>=0.10.9",
    "ipykernel>=6.31.0",
    "jupyter>=1.1.1",
    "liana[extras]",
    "nbclient>=0.11.0",
    "nbformat>=5.10.4",
    "novae>=1.0.0",
    "numcodecs>=0.14,<0.15",
    "scanpy>=1.11.5",
    "scimap[napari]>=2.3.6",
    "seaborn>=0.13.2",
    "spatialdata>=0.2",
    "spatialdata-plot>=0.2.3",
    "squidpy>=1.5.0",
    "xarray>=2023.12,<=2024.7.0",
]

[tool.uv]
override-dependencies = [
    "dask>=2024.9.1,<2025",
    "xarray-datatree>=0.0.15",
    "zarr>=2.14.0,<3",
]
